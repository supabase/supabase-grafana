# Grafana Alloy-based observability stack for Supabase.
#
# Alternative to the root docker-compose.yml which bundles Prometheus and
# Grafana into a single custom image. This setup uses official images per
# service and Grafana Alloy (open-source successor to Grafana Agent,
# EOL November 2025) as the metrics collector.
#
# Usage:
#   cp .env.example .env
#   # Fill in SUPABASE_PROJECT_REF and SUPABASE_API_KEY
#   docker compose -f docker-compose.alloy.yml up

services:

  alloy:
    image: grafana/alloy:v1.16.1
    ports:
      - "12345:12345"
    command: 
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.11.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=15d
    volumes:
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1
    ports: 
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes: 
      - ./grafana/datasource.alloy.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data: